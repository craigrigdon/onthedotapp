---
layout: default
---

<article class="wrap page">
  <header class="page-head">
    {% if page.icon %}
    <div class="page-head-icon">
      {% include app-icon.html name=page.icon class="app-icon app-icon-lg" alt="" size="160" %}
    </div>
    {% endif %}
    {% if page.eyebrow %}
    <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="lede">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
