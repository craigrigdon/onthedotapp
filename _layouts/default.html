<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <link rel="icon" href="{{ "/assets/img/favicon.png" | relative_url }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ "/assets/img/favicon-48.png" | relative_url }}" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="{{ "/assets/img/apple-touch-icon.png" | relative_url }}">
  <meta property="og:image" content="{{ "/assets/img/favicon-192.png" | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
</head>
<body class="theme-{{ page.theme | default: 'dot' }}">
  {% include site-header.html %}
  <main id="content">
    {{ content }}
  </main>
  {% include site-footer.html %}
</body>
</html>
