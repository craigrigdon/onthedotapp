title: On The Dot
description: Leave on time. On The Dot calculates when to go from where you are.
author: Craig Rigdon
url: "https://www.onthedotapp.com"
baseurl: ""

timezone: "America/Toronto"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  toc_levels: 1..3
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: page
      theme: dot
  - scope:
      path: "apps/ourbudget"
    values:
      theme: budget
      eyebrow: OurBudget
      icon: ourbudget

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - vendor
  - .gems
  - beautiful-jekyll-theme.gemspec
  - staticman.yml
include:
  - .well-known

plugins:
  - jekyll-sitemap
